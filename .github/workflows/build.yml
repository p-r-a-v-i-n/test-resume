name: Build Resume

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build resume
        uses: p-r-a-v-i-n/publish-latex@main
        with:
          source: resume.tex

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4